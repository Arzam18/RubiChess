name: RubiChess

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Patch Makefile and cputest.cpp for ARM64
        run: |
          cd src
          
          # 1. Patch Makefile to use llvm-objcopy for embedding network file
          python3 -c '
          import re
          with open("Makefile", "r") as f:
              content = f.read()
          pattern = r"\bld\s+-r\s+-b\s+binary\s+\$\(NETBIN\)\s+-o\s+\$\(NETOBJ\)"
          replacement = "$(ANDROID_NDK_HOME)/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy -I binary -O elf64-littleaarch64 -B aarch64 $(NETBIN) $(NETOBJ)"
          new_content, count = re.subn(pattern, replacement, content)
          with open("Makefile", "w") as f:
              f.write(new_content)
          print(f"Patched Makefile embedding rule ({count} instances).")
          '

          # 2. Patch cputest.cpp with ARM64 CPUID fallback macro
          python3 -c '
          with open("cputest.cpp", "r") as f:
              content = f.read()
          dummy_cpuid = """
          #if !defined(__x86_64__) && !defined(_M_X64) && !defined(__i386__) && !defined(_M_IX86)
          #ifndef CPUID
          #define CPUID(info, val) do { (info)[0] = (info)[1] = (info)[2] = (info)[3] = 0; } while(0)
          #endif
          #endif
          """
          with open("cputest.cpp", "w") as f:
              f.write(dummy_cpuid + "\n" + content)
          print("Patched cputest.cpp with ARM64 CPUID fallback.")
          '

      - name: Build RubiChess (ARM64 DotProd)
        run: |
          cd src
          make build ARCH=armv8-dotprod COMP=ndk EVALFILE=default -j$(nproc)

      - name: List build output
        run: |
          find src -maxdepth 1 -type f -executable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubichess-android-arm64
          path: src/RubiChess

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: RubiChess Android Build ${{ github.run_number }}
          prerelease: true
          files: src/RubiChess
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
