name: RubiChess for Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          cd src
          make build ARCH=armv8-dotprod COMP=ndk EVALFILE=default

      - name: List build output
        run: |
          find src -maxdepth 1 -type f -executable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubichess-android-arm64
          path: src/RubiChess

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: RubiChess Android Build ${{ github.run_number }}
          prerelease: true
          files: src/RubiChess
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
